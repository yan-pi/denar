[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/compiler",
    "crates/codec",
    "crates/vm",
    "crates/cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
btclisp-core = { path = "crates/core" }
btclisp-compiler = { path = "crates/compiler" }
btclisp-codec = { path = "crates/codec" }
btclisp-vm = { path = "crates/vm" }
bytes = "1"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ariadne = "0.4"
proptest = "1"
sha2 = "0.10"
ripemd = "0.1"
secp256k1 = { version = "0.29", features = ["recovery"] }
bitcoin = { version = "0.32", features = ["serde"] }
serde_json = "1"
